name: Deploy Nur Search to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository containing the React/Vite application.
      - name: Checkout
        uses: actions/checkout@v4

      # Install the current LTS Node runtime used by the frontend build.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install exactly what package-lock.json describes when it exists.
      - name: Install dependencies
        run: npm install

      # Build the static site. The repository name is supplied as the Vite base path.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # Upload the generated static files to GitHub's Pages artifact service.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Publish the artifact created by the build job.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4