<!doctype html>
<html lang="en">
  <head>
    <!--
      ============================================================
      DOCUMENT CONFIGURATION
      ============================================================
      This section contains the basic HTML document configuration
      and metadata used by browsers, search engines, and devices.
    -->

    <!--
      Character encoding:
      UTF-8 supports Arabic, English, Urdu, and other characters
      that may be displayed by the Quran & Sunnah application.
    -->
    <meta charset="UTF-8" />

    <!--
      Responsive viewport:
      Ensures the application scales correctly on mobile,
      tablet, laptop, and desktop screens.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!--
      Browser/mobile theme color:
      Used by supported browsers for browser UI elements such
      as the address bar and mobile browser theme.
    -->
    <meta
      name="theme-color"
      content="#071b16"
    />

    <!--
      SEO description:
      Provides a short description of the application to search
      engines and other services that read page metadata.
    -->
    <meta
      name="description"
      content="A source-first Quran and Sunnah search engine with browser AI."
    />

    <!--
      Page title:
      This text appears in the browser tab and may also be used
      by search engines as the page title.
    -->
    <title>Nur Search — Quran &amp; Sunnah</title>
  </head>

  <body>
    <!--
      ============================================================
      REACT APPLICATION ROOT
      ============================================================
      React uses this <div> as the mounting point for the entire
      single-page application.

      The React entry file (src/main.jsx) finds this element using
      its "root" ID and renders the application inside it.

      The HTML file itself remains intentionally lightweight because
      the UI is generated by React components.
    -->
    <div id="root"></div>

    <!--
      ============================================================
      VITE / REACT ENTRY POINT
      ============================================================
      This module loads the application's main React entry file.

      Vite processes this file during development and production
      builds and automatically bundles the required JavaScript
      modules and assets.

      IMPORTANT:
      Keep this path synchronized with the actual project structure:
      
          src/
            main.jsx
    -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
